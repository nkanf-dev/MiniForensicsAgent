[project]
name = "MiniForensicsAgent"
version = "0.1.0"
description = "A small local forensics-style codebase explorer for MLX models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "effgen[mlx]",
    "nicegui>=2.0",
    "rich",
    "textual",
]

[project.optional-dependencies]
turboquant = [
    "turboquant-mlx @ git+https://github.com/DeadByDawn101/turboquant-mlx.git@v2.0.0",
]

[project.scripts]
mini-forensics-agent = "miniforensicsagent.cli:main"
mini-forensics-agent-tui = "miniforensicsagent.tui:main"
mini-forensics-agent-gui = "miniforensicsagent.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniforensicsagent"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
